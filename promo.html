<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event &amp; Promo | Cilok Gajahan</title>
  <meta name="description" content="Event dan promo Cilok Gajahan: paket bundling, demo produk, free taster, dan dokumentasi event.">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section class="page-hero ep-hero">
  <div class="wrap">
    <p class="crumb"><a href="index.html">Beranda</a> &rsaquo; Event &amp; Promo</p>
    <h1>Event &amp; Promo</h1>
    <p class="phs">Promo terbaru dan jejak event Cilok Gajahan.</p>
    <div class="ep-car" id="car" role="region" aria-roledescription="carousel" aria-label="Event dan promo">
      <button class="ep-arrow" id="prev" aria-label="Sebelumnya">&lsaquo;</button>
      <div class="ep-stage" id="stage"></div>
      <button class="ep-arrow" id="next" aria-label="Berikutnya">&rsaquo;</button>
    </div>
    <div class="ep-dots" id="dots"></div>
  </div>
</section>

<section class="sec"><div class="wrap inner">
  <div class="blk ep-detail" id="detail" aria-live="polite"></div>
  <div class="blk"><p><a class="btn" data-ig>Kabar terbaru di Instagram</a> <a class="btn wa" data-wa="Halo Cilok Gajahan, ada promo atau event apa saja?" target="_blank" rel="noopener noreferrer">Tanya via WhatsApp</a></p></div>
</div></section>
</main>
<script src="site.js"></script>
<script>
/* Data event & promo. Tambah item baru di sini: gambar, judul, jenis, keterangan. */
const EP=[
 {k:'Promo',past:false,t:'Paket Bundling Cilok Gajahan',img:'images/promo-paket-bundling.jpg',alt:'Poster Paket Bundling Cilok Gajahan isi 7 pack',
  meta:'Isi 7 pack',
  d:'Paket bundling Cilok Gajahan isi 7 pack. Tanyakan harga, ketersediaan, dan cara pemesanan langsung lewat WhatsApp atau GoFood.',
  wa:'Halo Cilok Gajahan, saya tertarik dengan Paket Bundling Cilok Gajahan isi 7 pack. Mohon info harga dan cara pemesanan.'},
 {k:'Event',past:true,t:'Demo Produk dan Free Taster',img:'images/promo.jpg',alt:'Poster demo produk dan free taster Cilok Gajahan',
  meta:'Minggu, 2 Februari 2025 \u00b7 pukul 12.00 sampai selesai \u00b7 Galeri Pasar Kotagede',
  d:'Cilok Gajahan hadir bersama Mie Kakap Ratu Meal di Galeri Pasar Kotagede, dengan free taster untuk pengunjung.'},
 {k:'Event',past:true,t:'Lunar New Year Celebration',img:'images/event-lunar-new-year.jpg',alt:'Poster Lunar New Year Celebration di Malioboro Mall, 12 sampai 18 Februari 2018',
  meta:'12\u201318 Februari 2018 \u00b7 Malioboro Mall, Yogyakarta',
  d:'Perayaan Tahun Baru Imlek di Malioboro Mall dengan barongsai fire show, pertunjukan musik dan tari, berbagai kompetisi, serta bazaar.'}
];
const N=EP.length,stage=document.getElementById('stage'),dots=document.getElementById('dots'),detail=document.getElementById('detail');
let ci=0;
dots.innerHTML=EP.map((e,i)=>`<button aria-label="Tampilkan ${e.t}" data-i="${i}"></button>`).join('');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 stage.innerHTML=[-1,0,1].map(o=>{const i=(ci+o+N)%N,e=EP[i];
  return `<figure class="ep-card ${o==0?'is-cur':'is-side'}" data-i="${i}" data-o="${o}"${o?` tabindex="0" role="button" aria-label="Lihat ${esc(e.t)}"`:''}>
   <div class="ep-img"><img src="${e.img}" alt="${esc(e.alt)}" loading="lazy"><span class="ep-tag">${e.k}${e.past?' \u00b7 Sudah berlalu':''}</span></div>
   <figcaption>${esc(e.t)}</figcaption></figure>`;}).join('');
 dots.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i==ci));
 const e=EP[ci];
 detail.innerHTML=`<p class="kicker">${e.k}${e.past?' \u00b7 Sudah berlalu':' \u00b7 Terbaru'}</p><h2>${esc(e.t)}</h2><p class="ep-meta">${esc(e.meta)}</p><p>${esc(e.d)}</p>`
  +(e.past?'<p class="note">Event ini sudah berlalu dan ditampilkan sebagai dokumentasi.</p>':`<p><a class="btn wa" id="dwa" target="_blank" rel="noopener noreferrer">Tanya via WhatsApp</a> <a class="btn line" id="dgf" target="_blank" rel="noopener noreferrer">Pesan via GoFood</a></p>`);
 if(!e.past){document.getElementById('dwa').href=wa(e.wa);document.getElementById('dgf').href=CONFIG.gofood;}
}
const go=i=>{ci=(i+N)%N;render();};
document.getElementById('prev').addEventListener('click',()=>go(cur-1));
document.getElementById('next').addEventListener('click',()=>go(ci+1));
dots.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i);});
stage.addEventListener('click',e=>{const c=e.target.closest('.is-side');if(c)go(+c.dataset.i);});
stage.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.classList.contains('is-side')){e.preventDefault();go(+e.target.dataset.i);}});
document.getElementById('car').addEventListener('keydown',e=>{if(e.key=='ArrowLeft')go(cur-1);if(e.key=='ArrowRight')go(ci+1);});
let tx=null;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)go(ci+(d<0?1:-1));tx=null;});
render();
</script>
</body>
</html>
